<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>你的专属培养基 | 微生物人格研究所</title><style>
:root{--ink:#322b49;--purple:#8062bc;--soft:#f6f1ff;--green:#83a88e}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'PingFang SC','Microsoft Yahei',sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#e8ddff,transparent 38%),radial-gradient(circle at 90% 90%,#dcf3e6,transparent 40%),#faf8ff;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px;color:#897b9f;margin-bottom:30px}.panel{background:#ffffffdc;border:1px solid #fff;border-radius:28px;box-shadow:0 20px 65px #66528b18;padding:clamp(24px,6vw,48px);text-align:center;min-height:530px}.pill{display:inline-block;background:#f0e8ff;color:#7a5bb3;border-radius:99px;padding:8px 15px;font-size:12px;letter-spacing:1px}.dish{width:170px;height:170px;border:10px solid #c5b2e5;border-radius:50%;background:radial-gradient(circle at 25% 30%,#fff 0 7px,transparent 8px),radial-gradient(circle at 70% 45%,#fff 0 12px,transparent 13px),radial-gradient(circle at 40% 70%,#fff 0 9px,transparent 10px),#e6d8fa;box-shadow:inset 0 0 0 5px #ffffff9c,0 12px 30px #9980c23d;margin:35px auto;display:grid;place-items:center;font-size:52px;animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}h1{font-size:clamp(30px,7vw,45px);margin:15px 0}h2{font-size:clamp(23px,5vw,30px);line-height:1.45}p{line-height:1.9;color:#716782}.btn{background:var(--purple);color:white;border:0;border-radius:16px;padding:16px 30px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px #8062bc38;margin-top:22px}.btn.secondary{background:#f0e9fb;color:#6b51a2;box-shadow:none}.progress{height:8px;background:#eee8f5;border-radius:20px;overflow:hidden;margin:25px 0}.bar{height:100%;background:linear-gradient(90deg,#8d6cc5,#8fbaa0);transition:width .3s}.answers{display:grid;gap:12px;text-align:left;margin-top:30px}.answer{width:100%;padding:17px 19px;border:1.5px solid #e8e1f0;background:#fff;border-radius:16px;text-align:left;font-size:15px;color:#4c425f;cursor:pointer;transition:.2s}.answer:hover,.answer:focus{background:#f3edff;border-color:#9b7acb;transform:translateY(-2px)}.num{font-size:13px;color:#9077b5}.recipe{text-align:left;background:#f7f3fc;border-radius:18px;padding:20px;margin-top:22px}.recipe strong{color:#7253ab}.recipe div{line-height:2}.tag{display:inline-block;border-radius:20px;padding:5px 11px;background:#e6f3e8;color:#4e8060;font-size:12px;margin:4px}.footer{text-align:center;font-size:11px;color:#9b91a8;margin-top:25px}.hidden{display:none}.resulticon{font-size:80px;margin:25px auto 10px}.quote{font-style:italic;color:#8062bc;font-weight:600}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.actions .btn{margin-top:15px}@media(max-width:480px){.panel{min-height:570px}.answer{font-size:14px}}
</style></head><body><div class="wrap"><div class="top"><span>MICROBE PERSONALITY LAB</span><span>✳ CULTURE / 001</span></div><main class="panel" id="app"></main><div class="footer">微生物人格研究所 · 趣味测试，仅供娱乐，非科学心理测量或真实培养基配方</div></div><script>
const qs=[['刚进入一个完全陌生的实验室，你会……','先观察环境，摸清规则再行动','主动认识大家，迅速融入集体','寻找一个安静角落，自己探索','兴奋地到处看看，什么都想试试'],['如果把快乐当成一种碳源，你最依赖哪一种？','稳定的陪伴和熟悉的日常','新鲜体验与意想不到的惊喜','独处、思考和精神世界','目标达成时的成就感'],['你的理想生长环境是……','温暖、安静、规律的恒温培养箱','热热闹闹、菌落密集的平板','条件自由、可以随时改变的摇瓶','资源充足、竞争激烈的富集培养环境'],['遇到压力时，你通常会……','暂时降低代谢，独自恢复','寻找朋友倾诉，获得支持','改变策略，尝试另一条代谢途径','咬牙坚持，直到问题解决'],['如果只能给你的培养基添加一种特殊成分，你选……','缓冲体系，让一切保持稳定','生长因子，让自己被好好照顾','一种未知底物，看看会发生什么','额外能源，让自己持续高效运转'],['你最不喜欢哪种培养条件？','环境突然变化，毫无预警','长期孤立，没有任何交流','一成不变，没有探索空间','资源不足，能力无法发挥'],['如果你的生长曲线进入平台期，你会……','接受休整，等待下一轮生长','寻找同伴，交换新的想法','主动寻找新的生态位','设法突破限制，继续提高产量'],['你希望别人怎样描述你这株微生物？','温柔稳定，让人安心','有感染力，能让周围热闹起来','特别、有趣、不可预测','强大可靠，有惊人的生长潜力']];
const types=[{name:'恒温治愈型培养基',latin:'Medium Serenitas',icon:'🌱',desc:'你需要的不是最高浓度的营养，而是稳定、温柔且可预期的环境。你可以慢慢生长，但会扎下很深的根。',recipe:['稳定缓冲体系','温暖陪伴因子','低浓度压力源','充足恢复时间'],quote:'允许自己缓慢生长，也是一种生命力。'},{name:'共生快乐型培养基',latin:'Medium Symbiosis',icon:'🍄',desc:'你在交流和连接中获得能量。像微生物群落中的互利共生，你不仅会生长，还能让周围的生命变得鲜活。',recipe:['丰富有机营养','群体感应信号','社交生长因子','情感支持'],quote:'你的最佳生长条件，是有人与你共同发光。'},{name:'自由探索型培养基',latin:'Medium Curiositas',icon:'🧬',desc:'你有着灵活的代谢网络和旺盛的好奇心。比起被安排好的营养配方，你更喜欢亲自探索未知的底物。',recipe:['多样化碳源','开放生态位','微量未知元素','自由调节系统'],quote:'你不需要按照别人的生长曲线生活。'},{name:'高能突破型培养基',latin:'Medium Ambitio',icon:'⚡',desc:'目标和挑战是你的重要能源。你有很强的适应能力，越是值得投入的事情，越能激活你的生长潜力。',recipe:['高效能源底物','充足微量元素','诱导表达系统','定期恢复模块'],quote:'真正高效的生长，也需要给自己留出修复时间。'}];
let idx=0,answers=[];const app=document.querySelector('#app');function start(){idx=0;answers=[];question()}function home(){app.innerHTML=`<span class="pill">✦ PERSONAL CULTURE MEDIUM TEST ✦</span><div class="dish">🧫</div><h1>你的专属培养基</h1><p>如果你是一株独一无二的微生物，<br>怎样的培养环境，才能让你自由生长？</p><p>8 道小问题 · 约 2 分钟 · 解锁专属培养报告</p><button class="btn" onclick="start()">开始培养 →</button>`}function question(){let q=qs[idx];app.innerHTML=`<div class="num">QUESTION ${String(idx+1).padStart(2,'0')} / 08</div><div class="progress"><div class="bar" style="width:${idx/qs.length*100}%"></div></div><span class="pill">正在分析你的生长偏好…</span><h2>${q[0]}</h2><div class="answers">${q.slice(1).map((a,i)=>`<button class="answer" onclick="choose(${i})"><b style="color:#9a7ac5;margin-right:12px">${'ABCD'[i]}</b>${a}</button>`).join('')}</div>${idx?'<button class="btn secondary" onclick="back()">← 上一题</button>':''}`}function choose(v){answers[idx]=v;idx++;if(idx===qs.length)result();else question()}function back(){idx--;question()}function result(){let counts=[0,0,0,0];answers.forEach(v=>counts[v]++);let max=Math.max(...counts),w=counts.indexOf(max),t=types[w];app.innerHTML=`<span class="pill">✦ CULTURE REPORT ✦</span><div class="resulticon">${t.icon}</div><p>培养完成！你的专属类型是</p><h2>${t.name}</h2><p style="font-style:italic;color:#9678bd">${t.latin}</p><p>${t.desc}</p><div class="recipe"><strong>🧪 你的专属培养基配方</strong><div>${t.recipe.map(x=>`<span class="tag">${x}</span>`).join('')}</div><strong>📊 生长偏好指数</strong>${types.map((x,i)=>`<div style="font-size:12px;margin-top:8px">${x.name} · ${counts[i]}/8<div class="progress" style="margin:5px 0 9px;height:6px"><div class="bar" style="width:${counts[i]/8*100}%"></div></div></div>`).join('')}</div><p class="quote">“${t.quote}”</p><div class="actions"><button class="btn" onclick="shareResult(${w})">复制培养报告</button><button class="btn secondary" onclick="start()">重新培养 ↻</button></div>`}async function shareResult(i){let t=types[i],msg=`🧫 我的专属培养基：${t.name}\n${t.latin}\n${t.desc}\n专属配方：${t.recipe.join(' + ')}\n“${t.quote}”`;try{await navigator.clipboard.writeText(msg);alert('培养报告已复制！')}catch(e){prompt('长按复制你的培养报告：',msg)}}home();
</script></body></html>
