:root{--ink:#322b49;--purple:#8062bc;--soft:#f6f1ff;--green:#83a88e}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'PingFang SC','Microsoft Yahei',sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#e8ddff,transparent 38%),radial-gradient(circle at 90% 90%,#dcf3e6,transparent 40%),#faf8ff;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px;color:#897b9f;margin-bottom:30px}.panel{background:#ffffffdc;border:1px solid #fff;border-radius:28px;box-shadow:0 20px 65px #66528b18;padding:clamp(24px,6vw,48px);text-align:center;min-height:530px}.pill{display:inline-block;background:#f0e8ff;color:#7a5bb3;border-radius:99px;padding:8px 15px;font-size:12px;letter-spacing:1px}.dish{width:170px;height:170px;border:10px solid #c5b2e5;border-radius:50%;background:radial-gradient(circle at 25% 30%,#fff 0 7px,transparent 8px),radial-gradient(circle at 70% 45%,#fff 0 12px,transparent 13px),radial-gradient(circle at 40% 70%,#fff 0 9px,transparent 10px),#e6d8fa;box-shadow:inset 0 0 0 5px #ffffff9c,0 12px 30px #9980c23d;margin:35px auto;display:grid;place-items:center;font-size:52px;animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}h1{font-size:clamp(30px,7vw,45px);margin:15px 0}h2{font-size:clamp(23px,5vw,30px);line-height:1.45}p{line-height:1.9;color:#716782}.btn{background:var(--purple);color:white;border:0;border-radius:16px;padding:16px 30px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px #8062bc38;margin-top:22px}.btn.secondary{background:#f0e9fb;color:#6b51a2;box-shadow:none}.progress{height:8px;background:#eee8f5;border-radius:20px;overflow:hidden;margin:25px 0}.bar{height:100%;background:linear-gradient(90deg,#8d6cc5,#8fbaa0);transition:width .3s}.answers{display:grid;gap:12px;text-align:left;margin-top:30px}.answer{width:100%;padding:17px 19px;border:1.5px solid #e8e1f0;background:#fff;border-radius:16px;text-align:left;font-size:15px;color:#4c425f;cursor:pointer;transition:.2s}.answer:hover,.answer:focus{background:#f3edff;border-color:#9b7acb;transform:translateY(-2px)}.num{font-size:13px;color:#9077b5}.recipe{text-align:left;background:#f7f3fc;border-radius:18px;padding:20px;margin-top:22px}.recipe strong{color:#7253ab}.recipe div{line-height:2}.tag{display:inline-block;border-radius:20px;padding:5px 11px;background:#e6f3e8;color:#4e8060;font-size:12px;margin:4px}.footer{text-align:center;font-size:11px;color:#9b91a8;margin-top:25px}.hidden{display:none}.resulticon{font-size:80px;margin:25px auto 10px}.quote{font-style:italic;color:#8062bc;font-weight:600}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.actions .btn{margin-top:15px}@media(max-width:480px){.panel{min-height:570px}.answer{font-size:14px}}

</style></head><body><div class="wrap"><div class="top"><span>MICROBE PERSONALITY LAB</span><span>✳ CULTURE / 001</span></div><main class="panel" id="app"></main><div class="footer">微生物人格研究所 · 趣味测试，仅供娱乐，非科学心理测量或真实培养基配方</div></div><script>
const TYPES=[["LB 培养基","大肠杆菌","Escherichia coli","🧪","实验室全能选手","适应能力强，遇到新任务往往能迅速进入状态。","目标明确的伙伴","突如其来的无效加班","把复杂任务拆解成可执行步骤","多功能、快节奏、适应新环境",[78,65,77,85,52,65],"LB 常用于培养非苛养性大肠杆菌，具体菌株和实验条件会影响生长。"],["MRS 培养基","植物乳植杆菌","Lactiplantibacillus plantarum","🥛","温柔发酵家","细腻、可靠，善于把日常的小事慢慢酿成幸福。","能提供稳定回应的人","情绪冷暴力","把压力转化为温柔的坚持","稳定、亲密、能慢慢积累",[55,82,50,46,83,59],"MRS 常用于乳酸菌培养；不同乳酸菌生长需求并不完全相同。"],["YPD 培养基","酿酒酵母","Saccharomyces cerevisiae","🍞","快乐制造机","热情有感染力，总能把普通日子发酵出一点惊喜。","愿意一起折腾的朋友","长期孤军奋战","把社交氛围发酵成行动力","热闹、富营养、允许创作",[67,92,74,74,58,70],"YPD 是酿酒酵母常用的富营养培养基。"],["BG-11 培养基","聚球藻","Synechococcus sp.","☀️","阳光自驱探索者","好奇心就是你的光源，即使没有掌声也能保持自己的节奏。","尊重彼此独立空间的人","持续阴天式的负面环境","把光照转化成灵感","有光、有空间、有长期目标",[69,45,89,65,74,92],"BG-11 常用于部分蓝细菌培养；聚球藻不同株系可能需要不同盐度和培养条件。"],["R2A 培养基","环境异养细菌","Environmental heterotroph","🌿","低调慢生长观察家","你不急着占领整个平板，却总能注意到别人忽略的细节。","能安静相处的伙伴","被迫持续高速运转","在低资源条件下发现机会","低刺激、慢节奏、足够耐心",[79,43,76,35,94,81],"R2A 常用于环境或水样中部分异养细菌的恢复与计数；此结果是类群而非单一物种。"],["TSA 培养基","枯草芽孢杆菌","Bacillus subtilis","🛡️","韧性生存专家","平时踏实能干，遇到逆境更能展现惊人的生存智慧。","行动派队友","毫无意义的反复消耗","把逆境转化为下一轮生长的准备","稳定供给、允许挑战",[91,60,68,81,80,61],"TSA 是广泛使用的通用培养基，常用于多种非苛养细菌，包括枯草芽孢杆菌。"],["PDA 培养基","黑曲霉","Aspergillus niger","🍄","脑洞蔓延艺术家","你的想象力像菌丝一样延伸，总能从意想不到的角度找到出口。","欣赏奇思妙想的人","被要求所有事都循规蹈矩","把冷门兴趣长成一片宇宙","创作自由、灵感与时间",[61,57,96,63,68,97],"PDA 常用于霉菌和酵母的培养；黑曲霉是常见丝状真菌。"],["甘露醇高盐琼脂（MSA）","表皮葡萄球菌","Staphylococcus epidermidis","🧂","高盐抗压生活家","你有自己的边界，面对外界干扰依然能稳住阵脚。","懂分寸的人","边界被反复试探","在复杂环境里守住内核","明确边界、适度挑战",[96,58,52,66,77,73],"MSA 的高盐环境有利于筛选耐盐葡萄球菌；表皮葡萄球菌通常不发酵甘露醇，不能把培养基颜色变化当作物种鉴定。"],["麦康凯琼脂","肺炎克雷伯菌","Klebsiella pneumoniae","🔬","辨识度超高策略家","善于辨认规则和机会，总能找到适合自己的位置。","思路清晰的搭档","规则混乱却不允许提问","从复杂信号中筛选关键信息","明确规则、资源充足",[74,61,81,82,55,80],"麦康凯琼脂常用于分离革兰阴性肠道相关细菌；肺炎克雷伯菌是机会致病菌，结果仅作科普类比。"],["沙氏葡萄糖琼脂（SDA）","白色念珠菌","Candida albicans","🌙","多形态适应玩家","你能在不同场合切换表达方式，柔软却不失主见。","接受你多面性的人","被贴上单一标签","切换形态应对变化","可调整的环境、保留自我",[83,69,88,60,70,88],"SDA 常用于真菌培养；白色念珠菌是人体常见共生及机会致病真菌，不能由培养基单独鉴定。"],["营养琼脂（NA）","巨大芽孢杆菌","Priestia megaterium","🌾","朴素可靠建设者","你不靠花哨配置也能稳稳发挥，把基础打得扎实。","脚踏实地的同伴","资源浪费和无谓内耗","把简单资源用出高效率","清晰目标、稳定基础",[80,58,60,72,83,53],"营养琼脂是常见通用培养基；巨大芽孢杆菌现常称 Priestia megaterium。"],["改良查氏培养基","产黄青霉","Penicillium chrysogenum","🧫","自带配方的独立研究员","你擅长把有限资源组合成新答案，越研究越有自己的方法论。","尊重深度思考的人","被迫盲目跟风","把基础原料变成新点子","独立探索、可控变量",[72,46,94,69,75,94],"查氏类合成培养基常用于部分霉菌研究；不同配方和菌株适用性有差异。"]];
const QUESTIONS=[["来到新实验室，你首先会？",["观察规则、寻找稳定节奏","主动打招呼，认识新伙伴","四处探索，发现隐藏设备","直接开始解决最难的任务"]],["最能让你恢复活力的是？",["安静休息和熟悉的日常","与喜欢的人一起吃饭聊天","接触新知识或新地方","完成一项有挑战的目标"]],["团队任务中你通常负责？",["确保每一步稳妥落地","调节气氛、协调大家","提出新点子和替代方案","推动进度、攻克难关"]],["遇到突然变化，你更可能？",["先评估风险再调整","问问伙伴怎么想","把变化当作新实验","快速行动，边做边优化"]],["你最向往哪种周末？",["睡饱、整理房间、慢慢生活","和朋友安排丰富活动","随机出发探索陌生地点","完成一个长期想做的项目"]],["别人最常夸你的是什么？",["可靠、稳重、细心","亲切、热情、有感染力","脑洞大、想法特别","执行力强、能扛事"]],["如果资源有限，你会？",["精打细算，保存体力","寻找合作，交换资源","尝试新的资源组合","集中投入最有希望的方向"]],["你对独处的看法？",["是必要的充电方式","偶尔需要，但更爱陪伴","是自由探索的黄金时间","可以用来高效推进目标"]],["遇到意见分歧，你倾向？",["先让局面平稳下来","沟通理解各方感受","质疑前提，找第三条路","拿出证据，推动决策"]],["你希望自己的成长曲线是？",["平稳持续，长期向上","和伙伴共同成长","阶段性探索与突破","短时间集中爆发"]],["哪种环境最让你难受？",["混乱且不可预测","冷漠而缺少交流","重复且没有新意","目标模糊、缺乏反馈"]],["如果给自己一项超能力？",["在压力下自动修复","让周围人一起充满活力","随时切换新的生存策略","把挑战变成额外能量"]]];
const DIMS=['环境耐受度','群体感应力','代谢可塑性','生长爆发力','休眠恢复力','生态位独特性'];
const EXPLAIN=['应对压力与变化的韧性','建立连接、感知群体的倾向','探索新路径与切换策略的能力','面对目标时的行动能量','休息调整、长期续航的能力','保留独特风格的倾向'];
const WEIGHTS=[[1,0,0,0,1,0],[0,2,0,0,0,0],[0,0,2,0,0,2],[1,0,0,2,0,0]];
let idx=0,answers=[];const app=document.querySelector('#app');
function home(){app.innerHTML='<span class="pill">✦ MICROBE PERSONALITY LAB ✦</span><div class="dish">🧫</div><h1>你的专属培养基</h1><p>如果你是一株微生物，究竟适合什么培养基？<br>又会是哪一种真实存在的微生物？</p><p>12 道题 · 约 3 分钟 · 解锁菌株档案与六维生长图谱</p><button class="btn" onclick="start()">开始培养 →</button>'}
function start(){idx=0;answers=[];question()}
function question(){let q=QUESTIONS[idx];app.innerHTML='<div class="num">QUESTION '+String(idx+1).padStart(2,'0')+' / '+QUESTIONS.length+'</div><div class="progress"><div class="bar" style="width:'+(idx/QUESTIONS.length*100)+'%"></div></div><span class="pill">正在记录菌株生长偏好…</span><h2>'+q[0]+'</h2><div class="answers">'+q[1].map((a,i)=>'<button class="answer" onclick="choose('+i+')"><b style="color:#9a7ac5;margin-right:12px">'+('ABCD'[i])+'</b>'+a+'</button>').join('')+'</div>'+(idx?'<button class="btn secondary" onclick="back()">← 上一题</button>':'')}
function choose(v){answers[idx]=v;idx++;idx===QUESTIONS.length?result():question()}
function back(){idx--;question()}
function scores(){let cnt=[0,0,0,0];answers.forEach(a=>cnt[a]++);let s=[0,0,0,0,0,0];cnt.forEach((c,i)=>WEIGHTS[i].forEach((w,j)=>s[j]+=c*w));let vals=s.map((v,j)=>Math.min(97,Math.max(20,Math.round(35+v*5+(j===4?cnt[0]*2:0)))));return {cnt,vals}}
function pick(vals){let best=-Infinity,winner=0;TYPES.forEach((t,i)=>{let ideal=t[10],dist=ideal.reduce((sum,v,j)=>sum+Math.pow((vals[j]-v)/25,2),0);let score=-dist; if(score>best){best=score;winner=i}});return winner}
function result(){let obj=scores(),vals=obj.vals,who=pick(vals),t=TYPES[who];window.lastResult=who;let code='NKU-'+String(who+1).padStart(2,'0')+'-'+answers.reduce((s,x,i)=>s+(x+1)*(i+3),0).toString(16).toUpperCase();app.innerHTML='<span class="pill">✦ STRAIN IDENTIFICATION REPORT ✦</span><div class="resulticon">'+t[3]+'</div><p>培养成功！你的专属培养基是</p><h2>'+t[0]+'</h2><p class="quote">你的微生物身份：'+t[1]+'</p><p><i>'+t[2]+'</i> · '+t[4]+'</p><p>'+t[5]+'</p><div class="recipe"><strong>🧬 菌株编号：'+code+'</strong><div style="margin-top:12px"><strong>最适生长条件：</strong>'+t[9]+'</div><div><strong>共生搭子：</strong>'+t[6]+'</div><div><strong>主要抑制因子：</strong>'+t[7]+'</div><div><strong>特殊代谢技能：</strong>'+t[8]+'</div></div><div class="recipe"><strong>📊 六维生长特性图谱</strong><p style="font-size:12px;margin:6px 0 16px">基于本次回答计算的趣味指标，并非真实生物测量或心理量表</p>'+DIMS.map((d,i)=>'<div style="margin:12px 0 4px;display:flex;justify-content:space-between;font-size:14px"><b>'+d+'</b><b>'+vals[i]+'/100</b></div><div class="progress" style="margin:4px 0;height:9px"><div class="bar" style="width:'+vals[i]+'%"></div></div><div style="font-size:12px;color:#84778f">'+EXPLAIN[i]+'</div>').join('')+'</div><div class="recipe"><strong>🔬 真实培养知识</strong><p style="font-size:13px;margin-bottom:0">'+t[11]+'</p></div><p style="font-size:12px">注：培养基与微生物的对应关系是常见科研用途示例，不是唯一匹配；人格设定纯属趣味类比，不能用于微生物鉴定。</p><div class="actions"><button class="btn" onclick="shareResult()">复制我的菌株档案</button><button class="btn secondary" onclick="start()">重新培养 ↻</button></div>'}
async function shareResult(){let t=TYPES[window.lastResult],v=scores().vals;let msg='🧫 我的专属培养基：'+t[0]+'\n🔬 我的微生物身份：'+t[1]+' ('+t[2]+')\n'+t[4]+'｜'+t[5]+'\n🧬 六维生长特性：'+DIMS.map((x,i)=>x+v[i]).join(' / ')+'\n共生搭子：'+t[6]+'\n抑制因子：'+t[7]+'\n特殊代谢技能：'+t[8]+'\n趣味测试，仅供娱乐。';try{await navigator.clipboard.writeText(msg);alert('菌株档案已复制！')}catch(e){prompt('长按复制你的菌株档案：',msg)}}

function getCardInfo(){const i=window.lastResult,t=TYPES[i],v=scores().vals;return {t,v,code:'NKU-'+String(i+1).padStart(2,'0')+'-'+answers.reduce((s,x,j)=>s+(x+1)*(j+3),0).toString(16).toUpperCase()}}
function showCard(){const {t,v,code}=getCardInfo();let card=document.getElementById('microbe-id-card');if(!card){let area=document.createElement('section');area.id='idcard-section';area.innerHTML='<h2 style="margin-top:36px">🪪 我的微生物身份证</h2><p>生成一张可以保存和分享的专属菌株卡片</p><div id="microbe-id-card" class="idcard-preview"></div><div class="idcard-controls"><button class="btn" onclick="downloadCard()">保存高清图片 ↓</button><button class="btn secondary" onclick="shareCard()">分享身份证 ↗</button></div><p class="idcard-note">手机端可保存 PNG；若浏览器限制下载，请长按图片或使用系统分享。</p>';app.appendChild(area);card=document.getElementById('microbe-id-card')}card.innerHTML='<div class="idcard-head"><span>MICROBE IDENTITY CARD</span><span>✳ NKU / LAB</span></div><div class="idcard-avatar">'+t[3]+'</div><div style="font-size:11px;letter-spacing:1px;color:#8e7aa5">PERSONAL CULTURE MEDIUM</div><h3 class="idcard-title">'+t[0]+'</h3><div style="font-size:15px;font-weight:750;margin-top:12px">'+t[1]+' · '+t[4]+'</div><div class="idcard-latin">'+t[2]+'</div><div class="idcard-rule"></div><div style="font-size:11px;color:#82728d;margin-bottom:6px">STRAIN PROFILE · 生长特性</div>'+DIMS.map((x,j)=>'<div class="idcard-trait"><span>'+x+'</span><div class="idcard-track"><div class="idcard-fill" style="width:'+v[j]+'%"></div></div><b>'+v[j]+'</b></div>').join('')+'<div class="idcard-rule"></div><span class="idcard-chip">共生搭子：'+t[6]+'</span><span class="idcard-chip">特殊代谢：'+t[8]+'</span><div class="idcard-foot"><span>STRAIN NO. '+code+'</span><span>趣味人格类比 · 非科学鉴定</span></div>'}
function cardCanvas(){const {t,v,code}=getCardInfo(),W=900,H=1340,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');const grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#efe4fc');grad.addColorStop(.52,'#fffefd');grad.addColorStop(1,'#dff2e8');g.fillStyle=grad;g.fillRect(0,0,W,H);g.fillStyle='#8164ad';g.font='bold 23px sans-serif';g.fillText('MICROBE IDENTITY CARD',65,85);g.textAlign='right';g.fillText('✳ NKU / LAB',835,85);g.textAlign='left';g.font='115px sans-serif';g.fillText(t[3],65,245);g.fillStyle='#89759e';g.font='bold 23px sans-serif';g.fillText('PERSONAL CULTURE MEDIUM',65,318);function fit(s,max,size){let n=size;do{g.font='bold '+n+'px sans-serif';if(g.measureText(s).width<=max)break;n-=2}while(n>22);return n}g.fillStyle='#49375e';fit(t[0],760,62);g.fillText(t[0],65,400);g.font='bold 35px sans-serif';g.fillText(t[1]+' · '+t[4],65,470);g.fillStyle='#84758e';g.font='italic 27px serif';g.fillText(t[2],65,514);g.strokeStyle='#d7c9e6';g.lineWidth=2;g.beginPath();g.moveTo(65,557);g.lineTo(835,557);g.stroke();g.fillStyle='#82718e';g.font='bold 23px sans-serif';g.fillText('STRAIN PROFILE / 生长特性',65,615);DIMS.forEach((d,i)=>{let y=680+i*78;g.fillStyle='#544866';g.font='24px sans-serif';g.fillText(d,65,y);g.fillStyle='#e6ddec';g.beginPath();g.roundRect(305,y-20,450,21,11);g.fill();let p=g.createLinearGradient(305,0,755,0);p.addColorStop(0,'#8e6ac4');p.addColorStop(1,'#7fb5a0');g.fillStyle=p;g.beginPath();g.roundRect(305,y-20,450*v[i]/100,21,11);g.fill();g.fillStyle='#57456e';g.font='bold 24px sans-serif';g.fillText(String(v[i]),775,y)});g.strokeStyle='#d7c9e6';g.beginPath();g.moveTo(65,1145);g.lineTo(835,1145);g.stroke();g.fillStyle='#655578';g.font='22px sans-serif';function shorten(s){let x=s;while(g.measureText(x).width>755&&x.length>5)x=x.slice(0,-2);return x===s?s:x+'…'}g.fillText(shorten('共生搭子：'+t[6]),65,1190);g.fillText(shorten('特殊代谢：'+t[8]),65,1230);g.fillStyle='#91849d';g.font='19px sans-serif';g.fillText('STRAIN NO. '+code,65,1302);g.textAlign='right';g.fillText('趣味人格类比 · 非科学鉴定',835,1302);return c}
function downloadCard(){let c=cardCanvas(),a=document.createElement('a');a.download='我的微生物身份证.png';a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();let note=document.querySelector('.idcard-note');if(note)note.textContent='图片已生成。如果 iPhone 没有自动保存，可点击「分享身份证」并选择「存储图像」或「存储到文件」。'}
async function shareCard(){let c=cardCanvas(),blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob){downloadCard();return}let file=new File([blob],'我的微生物身份证.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'我的微生物身份证'});return}catch(e){if(e.name==='AbortError')return}}downloadCard()}

const originalResult=result;result=function(){originalResult();showCard()};home();
</script></body></html>
